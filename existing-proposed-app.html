<html lang="id">
<head>
  <meta charset="utf-8">

<style>.embedded .app{height:100dvh!important;width:100%;border:0;border-radius:0;margin:0;box-shadow:none}.embedded .preview-bar,.embedded .demo-controls,.embedded .preview-note,.embedded .reference-filter{display:none}.embedded .home-indicator{display:none}</style></head>
<body class="existing-preview embedded">
  <div class="preview-bar" hidden><span><b>BVGO</b> / Action Feed · Usulan</span><a href="notifications.html">Push notifications →</a></div>
  <div class="app" id="existing-app">
    <header id="existing-header"></header>
    <main id="existing-content" tabindex="-1"></main>
    <section id="response-access" aria-label="Respons Action"></section><nav id="existing-nav" class="bottom-nav" aria-label="Navigasi utama"></nav>
    <div class="home-indicator" aria-hidden="true"><span></span></div>
    <dialog id="existing-sheet" aria-labelledby="existing-sheet-title"></dialog>
  </div>
  <label class="reference-filter">Contoh tag <select id="tag-select"><option>Inspection Update</option><option>Announcement</option><option>Weekly Successful Pricing Recap</option><option>Extreme Bad Reviews</option></select></label><div class="demo-controls" aria-label="Kontrol prototype, bukan bagian aplikasi"><button id="previous" aria-label="Kartu sebelumnya">↑ Sebelumnya</button><span id="position" aria-live="polite"></span><button id="next" aria-label="Kartu berikutnya">Berikutnya ↓</button></div>
  <p class="preview-note">Swipe ke atas/bawah atau gunakan tombol demo. Ketuk kartu untuk detail, atau Tanggapi untuk merespons.<br>Komponen existing · 40 contoh asli BigRR · Respons dan komentar hanya simulasi.</p>
  <div id="existing-status" class="sr-only" role="status" aria-live="polite"></div>
</body>
